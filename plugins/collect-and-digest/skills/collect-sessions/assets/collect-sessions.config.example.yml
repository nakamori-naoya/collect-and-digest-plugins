# collect-sessions の設定の記入例。${XDG_CONFIG_HOME:-~/.config}/harness-plugins/collect-sessions.config.yml へ全keyを書いて置く。
# 同梱既定へのfallbackは無く、この例が既定値として読まれることもない。
version: 1
state_dir: ~/.local/state/harness-plugins/session-collect
timezone: Asia/Tokyo
sources:
  claude_code:
    enabled: true
    root: ~/.claude/projects
  codex:
    enabled: true
    root: ~/.codex/sessions
collection:
  include_subagents: true
  max_scan_files: 5000
  max_source_bytes: 52428800
  stable_read_retries: 3
  quiescent_after_minutes: 30
