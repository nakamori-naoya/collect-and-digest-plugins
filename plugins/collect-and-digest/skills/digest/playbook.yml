# digest — 収集物から期間ダイジェストを1本作る。
# 収集元と実行定義は <repo>/.harness-plugins/digest.config.yml（利用者設定）が持ち、工程順の正式な定義はこのYAMLである。
# 書くこと自体は write-doc の公開契約へ委ねる。
version: 2
name: digest
description: 収集物から期間ダイジェストの資料を1本作る
inputs: [user_input, references]

requires:
  - {plugin: write-doc, marketplace: write-doc}

steps:
  - id: config
    script: scripts/config.py
    purpose: 設定fileをgit rootの固定位置から読み、schema検査した値を返す
    provides: [config_path, config_values]

  - id: interpret-request
    agent_work: invoking_agent
    purpose: 同じagentが利用者の依頼を設定のdigests宣言と照合し、対象digestと基準時刻を確定する
    needs: [user_input, references, config_values]
    provides: [digest_name, reference_time]

  - id: material
    script: scripts/material.py
    purpose: 設定fileの置き場と期間から素材を選ぶ
    needs: [config_path, digest_name, reference_time]
    provides: [items, skipped, period, type, output, prompt]

  - id: meta
    script: scripts/doc-meta.py
    purpose: 資料の末尾に載せる静的情報の骨格を作る（参加者は書き手が埋める）
    needs: [config_path, items, period]
    provides: [meta]

  - id: document
    playbook: write-doc
    purpose: 素材、型、追加指示を渡して資料を書かせる
    input:
      document_type: period-digest
    needs: [items, period, type, output, prompt, meta, references]
    provides: [status, path, reason]
