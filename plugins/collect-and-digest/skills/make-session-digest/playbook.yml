# make-session-digest — 対象日に活動したエージェントセッションの日次要約を1本作る。
# 収集は同じpackageの公開skill collect-sessions、保存は write-doc の公開契約へ委ねる。工程順はこのYAMLが正本。
version: 2
name: make-session-digest
description: 対象日に活動したエージェントセッションの日次要約を作る
inputs: [user_input, references]

requires:
  - {plugin: write-doc, marketplace: write-doc}

# 保存先と資料化の契約。material.py と document 工程が読む。資料の型（見出し・front matter）は write-doc の agent-session-digest 型が定める。
# materialはmaterial.pyが標準出力へ返し、同じagentがインメモリで保持してwrite-docへkind:textで渡す。一時fileやcleanup工程は無い。
output:
  dir: ~/agent-session-digests
  format: markdown
  timezone: Asia/Tokyo
  subagents: exclude
contract:
  session_item_fields: [source, source_id, source_path, source_fingerprint, relation, parent_source_id, target_date, display, observed_at, collector]
  document_type: agent-session-digest
  output_name: <target_date>.md

steps:
  - id: collect
    skill: collect-sessions
    purpose: 対象日に活動したセッション索引を確定する
    needs: [user_input]
    provides: [index, target_date, provisional]

  - id: material
    script: scripts/material.py
    purpose: 索引から対象日のセッションmaterialを組み立て、標準出力のJSONとして返す
    needs: [index, target_date, provisional]
    provides: [material, input_hash, target_date, session_count]

  - id: document
    playbook: write-doc
    purpose: materialをkind:textの素材にし、write-docのagent-session-digest型でMarkdownを書いて保存する
    input:
      document_type: agent-session-digest
    needs: [material, input_hash, target_date, session_count, references]
    provides: [status, path, reason]
