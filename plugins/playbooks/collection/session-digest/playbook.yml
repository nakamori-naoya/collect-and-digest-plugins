version: 2
name: session-digest
description: 対象日に活動したエージェントセッションの日次要約を作る
instructions:
  execution:
    directive: 原文を永続化せず、非公開索引が指す正本を要約工程でだけ読み、stepsを上から順に実行する
requires:
  - {plugin: session-collect, marketplace: collect-and-digest}
  - {plugin: write-doc, marketplace: write-doc}
output:
  dir: ~/agent-session-digests
  format: markdown
  timezone: Asia/Tokyo
  max_chars_per_session: 400
  subagents: exclude
steps:
  - id: collect
    skill: collect-sessions
    purpose: 対象日に活動したセッション索引を確定する
    provides: [index, target_date, provisional]
  - id: material
    script: scripts/material.py
    purpose: 正本参照を非公開の一時materialへまとめる
    needs: [index, target_date, provisional]
    provides: [items, material_path, input_hash, target_date, session_count]
  - id: document
    playbook: write-doc
    purpose: 日次記録の契約とprivacy境界を追加指示として渡し、Markdownを書いて保存する
    needs: [items, input_hash, target_date, session_count]
    provides: [path]
  - id: cleanup
    script: scripts/material.py
    purpose: 最終資料の保存後、明示した今回のmaterialだけを安全に削除する
    needs: [material_path, path, index]
    provides: [cleanup_report]
contract:
  session_item_fields: [source, source_id, source_path, source_fingerprint, relation, parent_source_id, target_date, display, observed_at, collector]
  document_type: period-digest
  output_name: <target_date>.md
